<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="nexusGradLight" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="subGradLight" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6) scale(0.74)">
    <rect x="6" y="6" width="108" height="108" rx="30" fill="#F8FAFC" stroke="url(#nexusGradLight)" stroke-width="3.5" />
    <circle cx="60" cy="60" r="34" fill="url(#nexusGradLight)" opacity="0.12"/>
    <path d="M38 34 V86" stroke="url(#nexusGradLight)" stroke-width="8" stroke-linecap="round" />
    <path d="M82 34 V86" stroke="url(#nexusGradLight)" stroke-width="8" stroke-linecap="round" />
    <path d="M38 38 L82 82" stroke="url(#nexusGradLight)" stroke-width="8" stroke-linecap="round" />
    <circle cx="38" cy="34" r="5.5" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="38" cy="86" r="5.5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="82" cy="34" r="5.5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="82" cy="86" r="5.5" fill="#9333EA" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="60" cy="60" r="4" fill="#0F172A" />
